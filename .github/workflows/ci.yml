name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test jobs tools and server profile
        run: >-
          uv run pytest
          tests/test_jobs_only_server.py
          tests/test_direct_cli.py
          tests/linkedin/test_jobs.py
          tests/linkedin/test_job_pages.py
          tests/test_tools.py::TestJobTools
          tests/test_server.py::TestServerRoles
          tests/test_server.py::TestServerInstructions
